name: ListingLensQC
options:
  bundleIdPrefix: com.marineaidev.listinglensqc
  deploymentTarget:
    iOS: "17.0"
packages:
  LocalizationKit:
    path: ../iOS_localization_kit
targets:
  ListingLensQC:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ListingLensQC/App
      - path: ListingLensQC/Screens
      - path: ListingLensQC/Analysis
      - path: ListingLensQC/DesignSystem
      - path: ListingLensQC/Localization
      - path: Assets/Assets.xcassets
      - path: Assets/PrivacyInfo.xcprivacy
      - path: Assets/Localizable.xcstrings
    dependencies:
      - package: LocalizationKit
        product: LocalizationKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marineaidev.listinglensqc
        PRODUCT_NAME: ListingLens QC
        INFOPLIST_FILE: ListingLensQC/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  ListingLensQC:
    build:
      targets:
        ListingLensQC: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
